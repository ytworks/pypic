name: research

# Exists only on research branches (.claude/rules/research/branching.md); main's ci.yml is unchanged.

on:
  push:
    branches: ["research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  only-into-research:
    # GitHub reads a pull request's workflows from its merge commit, so this job runs exactly when
    # a pull request carries the research files. Into a research branch that is a review within
    # research; into any other branch (main above all) it is refused: research is never merged there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Research files only into research branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            research/*) echo "$HEAD -> $BASE: within the research branches"; exit 0 ;;
          esac
          echo "::error::$HEAD -> $BASE carries the research files. Research branches are never merged into $BASE (.claude/rules/research/branching.md); close this pull request."
          exit 1

  checks:
    # A push to a research branch, or a pull request into one (checked on its merge commit, by the
    # rules of the base branch).
    if: github.event_name == 'push' || startsWith(github.base_ref, 'research/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # merge-bases with main and trunk, ancestry of recorded commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (tools only; the engine is main's and is checked by main's CI)
        run: python -m pip install ruff pytest
      - name: Branch rules
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python research/tools/check_branch.py --branch "$BRANCH"
      - name: Lint
        run: ruff check research
      - name: Tool tests
        run: python -m pytest -q research/tests
