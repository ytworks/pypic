# Linear wake of a rigid electron bunch (gate): n_b = 0.05 n0, sigma_x = sigma_r = 1 c/omega_pe,
# gamma = 10, on a heavy partner at rest; conducting transverse walls.
driver: bunch
nx: 900
n_perp: 192
width: 24
dx: 0.125
transverse: reflecting
ramp: [2, 5, 107, 110]
x_end: 100
bunch_density: 0.05
sigma_x: 1
sigma_r: 1
gamma: 10
start: 12
ppc: 8
