# 16-step check of the exploratory run L (topic spherical-shock-injection; protocol: ../exploratory-protocol.md).
#
# The same plasma, field, grid and seed as explore-L.yaml, 16 steps, every output written at least twice.
# It measures the time per step, the cost of the tracks and the size of the files, and it passes every output
# path once. It is not a physics run. The dump hot_e selects gamma >= 1.05 here, so that the selected dump,
# which has no test in the repository, is written non-empty: about 1.7 % of the ambient electrons
# (3.2 thermal speeds). At gamma >= 1.02 it would hold 26 % of them (2.4e8 electrons in one file).
mass_ratio: 16
mach_alfven: 3.5
wpe_wce: 3.5
vte: 0.1
ti_te: 1.0
rm: 16.0
shell_radius: 0.33
shell_width: 0.1
debris_beams: 4
body: false          # no absorbing sphere and no dipole: a remnant has no magnetised body
half_width: 1.3      # the planner's lower limit, in R_B
cells_per_de: 2.0
ppc: 2
run: 1.25
filter_passes: 4
seed: 12345
overrides:
  precision: compact
  n_steps: 16
  diag_interval: 4
  gauss_interval: 8
output:
  # This list replaces the planner's. The first three entries repeat the planner's own diagnostics (same
  # names, block size and cadence), because examples/blast_wave/analyze.py reads them; the slices also carry
  # the electron moments and J. The others are for the electrons. The box is 384 d_e wide, centre at 192.
  diagnostics:
    - name: coarse
      kind: fields
      fields: ["n:e", "flux:e", "ekin:e", "n:i", "flux:i", "ekin:i", "n:de", "flux:de", "ekin:de",
               "n:di", "flux:di", "ekin:di", E, B, rho]
      coarsen: [13, 13, 13]
      every: 8
    - name: slice_z            # equatorial plane, z = centre: theta_Bn = 90 deg all around
      kind: slice
      fields: ["n:e", "n:i", "n:de", "n:di", "flux:i", "flux:e", "ekin:e", E, B, J]
      axis: z
      position: 192.0
      coarsen: [1, 1, 1]
      every: 4
    - name: slice_y            # meridional plane, y = centre: contains B0, all theta_Bn from 0 to 90 deg
      kind: slice
      fields: ["n:e", "n:i", "n:de", "n:di", "flux:i", "flux:e", "ekin:e", E, B, J]
      axis: y
      position: 192.0
      coarsen: [1, 1, 1]
      every: 4
    - name: spec_meridional    # energy spectra by position in a slab of 16 d_e around the meridional plane
      kind: histogram
      species: [e, i, de, di]
      quantities: [x, z, ekin]
      bins: [192, 192, 96]
      ranges: [[0.0, 384.0], [0.0, 384.0], [0.0001, 100.0]]
      log: [false, false, true]
      region: [null, [184.0, 200.0], null]
      every: 8
    - name: spec_equatorial    # the same in a slab of 16 d_e around the equatorial plane
      kind: histogram
      species: [e, i, de, di]
      quantities: [x, y, ekin]
      bins: [192, 192, 96]
      ranges: [[0.0, 384.0], [0.0, 384.0], [0.0001, 100.0]]
      log: [false, false, true]
      region: [null, null, [184.0, 200.0]]
      every: 8
    - name: spec_all           # energy spectra of the whole box
      kind: histogram
      species: [e, i, de, di]
      quantities: [ekin]
      bins: [224]
      ranges: [[0.000001, 100.0]]
      log: [true]
      every: 4
    - name: spec_up            # far upstream (a corner column the blast never reaches): numerical heating
      kind: histogram
      species: [e, i]
      quantities: [ekin]
      bins: [224]
      ranges: [[0.000001, 10.0]]
      log: [true]
      region: [[16.0, 48.0], [16.0, 48.0], [16.0, 368.0]]
      every: 4
    - name: hot_e              # gamma >= 1.05 in this check only (see the head of the file)
      kind: particles
      species: [e, de]
      select: {gamma_min: 1.05}
      every: 8
    - name: tracks_e           # about 1.9e5 ambient electrons followed from the start, with E and B at the particle
      kind: tracks
      species: [e]
      stride: 4733
      with_fields: true
      every: 4
