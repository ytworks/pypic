# Run P5 of the topic spherical-shock-injection (designed 2026-11-13): a strong shock on a sphere, made by a
# heavy piston. Record and reasons: ../strong-shock-run.md. An observation run: it supports no hypothesis.
# Run with ../run_piston.py, not with examples/blast_wave/run.py: the box is smaller than 1.3 R_B.
#
# The plasma, the grid, the box (384 d_e), the cell, the particles and the seed are those of explore-L.yaml, so
# beta = 0.49 and L-null is the null run. Changed: mach_alfven 3.5 -> 5.0 (V_d = 0.357 c; B0 is unchanged),
# rm 16 -> 35 d_i (R_m = 140 d_e = 7 debris gyroradii; the debris does not stop inside the box), debris_beams
# 4 -> 2 (memory: the cloud holds five times the particles of L's), half_width and run in units of
# R_B = 409.4 d_e: 192 d_e and t = 360 = 6.4 / Omega_ci (1440 steps), which ends when the front is expected at
# the edge of the usable box (184 d_e). The output cadences follow the shorter run: slices every 9 time units
# = 0.16 / Omega_ci.
mass_ratio: 16
mach_alfven: 5.0
wpe_wce: 3.5
vte: 0.1
ti_te: 1.0
rm: 35.0
shell_radius: 0.33
shell_width: 0.1
debris_beams: 2
body: false          # no absorbing sphere and no dipole: a remnant has no magnetised body
half_width: 0.46902  # 192 d_e: the box of L
cells_per_de: 2.0
ppc: 2
run: 0.31408         # 1440 steps, t = 360
filter_passes: 4
seed: 12345
overrides:
  precision: compact
output:
  # This list replaces the planner's. The entries coarse, slice_z and slice_y repeat the planner's own
  # diagnostics (same names, block size and cadence), because examples/blast_wave/analyze.py reads them; the
  # slices also carry the electron moments and J. The others are for the electrons. The box is 384 d_e wide,
  # centre at 192. Changed on 2026-11-13 after the review R1 (../reviews/2026-11-13-protocol-r1.md): slice_x,
  # ekin:i in the slices, hot_e from gamma 1.25, denser tracks. The track cadence and stride were fixed by the
  # 600-step check (check-L-cadence.yaml). Cadences of this run: every_3d = 144 steps; slices, spec_all and
  # spec_up every 36; the spectra by position and hot_e every 72. The block of `coarse` stays 13 cells as in L
  # (the planner would take 28 here).
  diagnostics:
    - name: coarse
      kind: fields
      fields: ["n:e", "flux:e", "ekin:e", "n:i", "flux:i", "ekin:i", "n:de", "flux:de", "ekin:de",
               "n:di", "flux:di", "ekin:di", E, B, rho]
      coarsen: [13, 13, 13]
      every: 144
    - name: slice_z            # equatorial plane, z = centre: theta_Bn = 90 deg all around
      kind: slice
      fields: ["n:e", "n:i", "n:de", "n:di", "flux:i", "flux:e", "ekin:e", "ekin:i", E, B, J]
      axis: z
      position: 192.0
      coarsen: [1, 1, 1]
      every: 36
    - name: slice_y            # meridional plane, y = centre: contains B0, all theta_Bn from 0 to 90 deg
      kind: slice
      fields: ["n:e", "n:i", "n:de", "n:di", "flux:i", "flux:e", "ekin:e", "ekin:i", E, B, J]
      axis: y
      position: 192.0
      coarsen: [1, 1, 1]
      every: 36
    - name: slice_x            # second meridional plane, x = centre: tests that the front is axisymmetric
      kind: slice
      fields: ["n:e", "n:i", "n:de", "n:di", "flux:i", "flux:e", "ekin:e", "ekin:i", E, B, J]
      axis: x
      position: 192.0
      coarsen: [1, 1, 1]
      every: 36
    - name: spec_meridional    # energy spectra by position in a slab of 16 d_e around the meridional plane
      kind: histogram
      species: [e, i, de, di]
      quantities: [x, z, ekin]
      bins: [192, 192, 96]
      ranges: [[0.0, 384.0], [0.0, 384.0], [0.0001, 100.0]]
      log: [false, false, true]
      region: [null, [184.0, 200.0], null]
      every: 72
    - name: spec_equatorial    # the same in a slab of 16 d_e around the equatorial plane
      kind: histogram
      species: [e, i, de, di]
      quantities: [x, y, ekin]
      bins: [192, 192, 96]
      ranges: [[0.0, 384.0], [0.0, 384.0], [0.0001, 100.0]]
      log: [false, false, true]
      region: [null, null, [184.0, 200.0]]
      every: 72
    - name: spec_all           # energy spectra of the whole box
      kind: histogram
      species: [e, i, de, di]
      quantities: [ekin]
      bins: [224]
      ranges: [[0.000001, 100.0]]
      log: [true]
      every: 36
    - name: spec_up            # far upstream (a corner column the blast never reaches): numerical heating
      kind: histogram
      species: [e, i]
      quantities: [ekin]
      bins: [224]
      ranges: [[0.000001, 10.0]]
      log: [true]
      region: [[16.0, 48.0], [16.0, 48.0], [16.0, 368.0]]
      every: 36
    - name: hot_e              # every electron with gamma >= 1.25, with its id; the census counts gamma >= 1.5.
      # The margin below 1.5 gives the history of an electron before it crosses the threshold (review R1).
      kind: particles
      species: [e, de]
      select: {gamma_min: 1.25}
      every: 72
    - name: tracks_e           # about 9.6e5 ambient electrons followed from the start, with E and B at the
      # particle. Stride 947 (prime, shares no factor with 768), every 2 steps: the cadence at which the work
      # of the recorded field closes per orbit (check-L-cadence, protocol Sect. 2); 27 GB on disk.
      kind: tracks
      species: [e]
      stride: 947
      with_fields: true
      every: 2
