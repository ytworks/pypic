.s1 { fill:#e9ecf2; stroke:#c9d1cd; } .s2 { fill:#d6e2f3; stroke:#c9d1cd; }
.s3 { fill:#e2e2dc; stroke:#c9d1cd; } .s4 { fill:#fbfbf8; stroke:#c9d1cd; }
.gain { fill:#f6d9d2; stroke:#b8382a; } .loss { fill:#d6e2f3; stroke:#2b5fa8; }
.nvec { stroke:#1c2421; stroke-width:2; } .bvec { stroke:#2f8a3e; stroke-width:2.5; }
.dot { fill:#1c2421; } .edot { fill:#b8382a; } .dn { stroke:#1c2421; stroke-width:1.2; }
