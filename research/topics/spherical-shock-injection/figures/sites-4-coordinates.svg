<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkr"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkg"/></marker>
</defs><path class="front" d="M40,250 Q260,150 480,250"/><text class="lab sm" x="470" y="268" text-anchor="end">衝撃波面（極角ごとの r_f(θ) をつないだ面）</text><circle class="dot" cx="260" cy="200" r="4"/><line class="nvec" x1="260" y1="200" x2="260" y2="40" marker-end="url(#ah)"/><text class="lab b" x="266" y="50">n（面の法線）</text><line class="bvec" x1="260" y1="200" x2="399.3" y2="102.5" marker-end="url(#ahg)"/><text class="lab b grn" x="405.3" y="102.5">B（電子の位置で測った局所磁場）</text><path class="thin" d="M260,140 A60,60 0 0 1 309.1,165.6"/><text class="lab" x="282" y="134">局所 θ_Bn</text><circle class="edot" cx="190" cy="90" r="6"/><text class="lab red" x="180" y="80" text-anchor="end">電子</text><line class="thin dash" x1="190" y1="90" x2="190" y2="194"/><line class="dn" x1="164" y1="90" x2="164" y2="196" marker-start="url(#ahs)" marker-end="url(#ahs)"/><text class="lab" x="158" y="145" text-anchor="end">Δn</text><text class="lab sm" x="20" y="300">場所の座標 =（法線方向の距離 Δn、局所 θ_Bn、|B|/B₀）</text><text class="lab sm" x="20" y="318">磁力線を横切る距離 = Δn / sin θ_Bn　　磁力線に沿った距離 = Δn / cos θ_Bn</text></svg>